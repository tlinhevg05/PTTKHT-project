name: CI - Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Unit Tests (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apartment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apartment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # 3. Make Maven wrapper executable
      - name: Make mvnw executable
        run: chmod +x mvnw

      # 4. Run tests
      - name: Run tests
        env:
          # Ephemeral credentials used only inside this CI job.
          DB_URL: jdbc:postgresql://localhost:5432/apartment_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress

      # 5. Upload Surefire test report
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
